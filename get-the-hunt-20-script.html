<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>suic1.de</title>
  <meta name="description" content="suic1.de">
  <meta property="og:title" content="suic1.de">
  <meta property="og:description" content="suic1.de">
  <meta property="og:image" content="https://suic1.de/banner.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="suic1.de">
  <meta name="twitter:description" content="suic1.de">
  <meta name="twitter:image" content="https://suic1.de/banner.png">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="https://suic1.de/icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff; font-family: Arial, sans-serif; overflow: hidden; position: relative; }
    .rain { position: absolute; inset: 0; z-index: 0; overflow: hidden; opacity: 0.19; pointer-events: none; }
    .rain span { position: absolute; top: -10%; left: var(--x); color: #fff; font: 12px/1 monospace; animation: fall var(--duration) linear var(--delay) infinite; user-select: none; }
    @keyframes fall { from { transform: translateY(-10vh); } to { transform: translateY(115vh); } }
    .gp { position: relative; z-index: 1; width: 90%; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
    h1 { font-size: clamp(2.5rem, 9vw, 5.5rem); font-weight: 400; letter-spacing: -0.07em; line-height: 0.95; text-align: center; }
    .card { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .ttl { font-size: 1rem; font-weight: 600; letter-spacing: 0.2px; }
    .cb { width: 100%; background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.25); padding: 16px 18px; font-family: monospace; font-size: 0.85rem; color: #fff; word-break: break-all; line-height: 1.5; white-space: pre-wrap; }
    button { background: #fff; color: #000; border: none; border-radius: 0; padding: 10px 24px; font-weight: 600; font-size: 0.85rem; cursor: pointer; align-self: flex-start; }
    button:hover { background: #eaeaea; }
    .gh { color: #fff; transition: opacity 0.2s; }
    .gh:hover { opacity: 0.65; }
    .gh svg { width: 28px; height: 28px; }
    @media (prefers-reduced-motion: reduce) { .rain span { animation: none; } }
  </style>
</head>
<body>
  <div class="rain" id="rain"></div>
  <div class="gp">
    <h1>suic1.de</h1>
    <div class="card">
      <div class="ttl">The Hunt 20 Script</div>
      <div class="cb" id="cb">loadstring(game:HttpGet("https://suic1.de/the-hunt-20-hub"))()</div>
      <button id="cp">Copy</button>
    </div>
    <a class="gh" href="https://github.com/ArchIsDead/ihatemylife" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.74.08-.74 1.2.08 1.83 1.23 1.83 1.23 1.07 1.83 2.8 1.3 3.48.99.11-.77.42-1.3.76-1.6-2.66-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.76.84 1.23 1.91 1.23 3.22 0 4.61-2.81 5.62-5.49 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57A12 12 0 0 0 12 .5Z" />
      </svg>
    </a>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const rain = $('rain');
    const cb = $('cb');
    const cp = $('cp');

    for (let i = 0; i < 42; i++) {
      const span = document.createElement('span');
      span.textContent = 'retard';
      span.style.setProperty('--delay', (i % 9) * 0.7 + 's');
      span.style.setProperty('--x', (i * 23) % 100 + '%');
      span.style.setProperty('--duration', 5 + (i % 5) + 's');
      rain.appendChild(span);
    }

    cp.addEventListener('click', () => {
      const text = cb.textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          cp.textContent = 'Copied';
          setTimeout(() => { cp.textContent = 'Copy'; }, 1200);
        }).catch(() => {
          cp.textContent = 'Failed';
          setTimeout(() => { cp.textContent = 'Copy'; }, 1200);
        });
      }
    });
  </script>
</body>
</html>
